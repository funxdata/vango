version: "2"

run:
  timeout: 5m

linters:
  # standard 已包含 errcheck、govet、ineffassign、staticcheck、unused。
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
  exclusions:
    rules:
      # 测试中允许更宽松的写法
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
