name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -n 1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build cli image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vango:ci
          build-args: |
            VERSION=ci
            GIT_COMMIT=${{ github.sha }}
            BUILD_AT=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test cli image
        run: docker run --rm vango:ci version

      - name: build example image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/hello/Dockerfile
          push: false
          load: true
          tags: vango-hello:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test example image
        run: |
          docker run -d --name hello -p 8080:8080 vango-hello:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/greet/vango
          docker run --rm --network host vango-hello:ci healthcheck || true
          docker rm -f hello
